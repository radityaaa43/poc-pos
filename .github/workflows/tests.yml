name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: PUPPETEER_SKIP_DOWNLOAD=true npm ci --no-audit --no-fund

      - name: Lint (ESLint)
        run: npm run lint

      - name: Run frontend tests with coverage
        run: npm run test:coverage

      - name: Test the e2e scaffold
        run: node --test tests/e2e/support/new-feature.test.mjs

      - name: Build frontend
        run: npm run build

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/frontend/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/frontend/coverage-summary.json").total;
              const row = (k) => `| ${k} | ${t[k].pct}% |`;
              console.log(["### Frontend coverage", "", "| Metric | Covered |", "|---|---|",
                row("lines"), row("statements"), row("branches"), row("functions")].join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/frontend
          retention-days: 14

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-test-only
          MYSQL_DATABASE: point_of_sales_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-test-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      # Env beats phpunit.xml's sqlite defaults, so the suite runs on the MySQL service.
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: point_of_sales_ci
      DB_USERNAME: root
      DB_PASSWORD: ci-test-only
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Pint --diff needs origin/main

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, sqlite3, zip, gd, exif
          coverage: pcov

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Static analysis (Larastan)
        run: composer analyse

      # On push to main origin/main is HEAD, so the diff would be empty: PRs only.
      - name: Code style (Pint, changed files)
        if: github.event_name == 'pull_request'
        run: vendor/bin/pint --test --diff=origin/main

      # Feature tests render Inertia pages, which need public/build/manifest.json.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend
        run: PUPPETEER_SKIP_DOWNLOAD=true npm ci --no-audit --no-fund && npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run backend tests with coverage
        run: vendor/bin/phpunit --coverage-clover=coverage/backend/clover.xml --coverage-html=coverage/backend/html

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/backend/clover.xml ]; then
            php -r '
              $m = simplexml_load_file("coverage/backend/clover.xml")->project->metrics;
              $pct = fn ($c, $t) => $t ? round(100 * $c / $t, 2) : 0;
              echo "### Backend coverage (MySQL 8.4)\n\n| Metric | Covered |\n|---|---|\n";
              echo "| lines | ".$pct((int) $m["coveredstatements"], (int) $m["statements"])."% |\n";
              echo "| methods | ".$pct((int) $m["coveredmethods"], (int) $m["methods"])."% |\n";
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage/backend
          retention-days: 14

  e2e:
    name: E2E (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: point_of_sales_e2e
          MYSQL_ROOT_PASSWORD: secret # throwaway service container, not a secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psecret"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      # Same values as the app-e2e service in docker-compose.yml. Real env vars win over .env.
      APP_ENV: e2e
      APP_URL: http://127.0.0.1:8010
      APP_TIMEZONE: UTC
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: point_of_sales_e2e
      DB_USERNAME: root
      DB_PASSWORD: secret
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
      BCRYPT_ROUNDS: 4
      INERTIA_SSR_ENABLED: 'false'
      SECURITY_BOT_GUARD_MIN_SUBMIT_SECONDS: 0
      AUTH_FORGOT_PASSWORD_THROTTLE: 1000,1
      PHP_CLI_SERVER_WORKERS: 4
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, sqlite3, zip, gd, exif
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install JS dependencies
        run: PUPPETEER_SKIP_DOWNLOAD=true npm ci --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan e2e:reset

      - name: Start app
        # --no-reload keeps the env above; without it artisan serve falls back to .env.
        run: |
          php artisan serve --host=127.0.0.1 --port=8010 --no-reload > storage/logs/serve.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null http://127.0.0.1:8010/login && exit 0
            sleep 1
          done
          echo 'App did not start within 60 s' >&2
          cat storage/logs/serve.log
          exit 1

      - name: Run e2e shard
        # The database was reset above, and each shard job has its own.
        run: npx playwright test -c tests/e2e/playwright.config.js --shard="$SHARD/$SHARD_TOTAL"
        env:
          E2E_SKIP_RESET: 1
          E2E_BASE_URL: http://127.0.0.1:8010
          SHARD: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ strategy.job-total }}

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 1

      - name: Upload app logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ matrix.shard }}
          path: storage/logs
          retention-days: 7

  e2e-report:
    name: E2E
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: PUPPETEER_SKIP_DOWNLOAD=true npm ci --no-audit --no-fund

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge into one HTML report
        if: needs.e2e.result != 'skipped'
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload HTML report
        if: needs.e2e.result != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - name: Fail if any shard failed
        if: needs.e2e.result != 'success'
        run: exit 1
