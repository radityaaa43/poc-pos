name: Governance script tests

# The checks that guard every PR are code too: their tests run whenever they or the config change.
on:
  pull_request:
    paths:
      - .github/scripts/**
      - .github/governance.json
      - .claude/hooks/**
  push:
    branches: [main]
    paths:
      - .github/scripts/**
      - .github/governance.json
      - .claude/hooks/**

permissions:
  contents: read

jobs:
  tests:
    name: Script and hook tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - run: python3 -m unittest discover -s .claude/hooks
        env:
          CLAUDE_PROJECT_DIR: ${{ github.workspace }}
