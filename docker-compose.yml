# Local development stack (no PHP/MySQL needed on host).
# Vite runs on the host: `npm run dev`.
#   docker compose up -d          -> app http://localhost:8000, MySQL localhost:3307
#   docker compose exec app php artisan ...
name: poc-pos

x-php: &php
  build: ./docker/php
  image: poc-pos-php:8.4
  working_dir: /var/www/html
  volumes:
    - .:/var/www/html
    # vendor/ lives in a Docker volume: bind-mounted Windows fs is too slow for
    # opcache stat() on thousands of vendor files. Run composer inside the container.
    - vendor:/var/www/html/vendor
  depends_on:
    mysql:
      condition: service_healthy

services:
  app:
    <<: *php
    environment:
      PHP_CLI_SERVER_WORKERS: 4
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "8000:8000"

  queue:
    <<: *php
    command: php artisan queue:work --tries=3 --sleep=3

  # End-to-end suite target (profile `e2e`, see tests/e2e/README.md):
  #   docker compose --profile e2e up -d app-e2e   -> http://localhost:8010, DB point_of_sales_e2e
  # Everything the app needs is set here: real env vars win over .env (Dotenv is immutable), and
  # --no-reload is required, otherwise `artisan serve` drops them and falls back to .env (your dev DB).
  # APP_KEY is a throwaway key that only protects the e2e database.
  app-e2e:
    <<: *php
    profiles: ["e2e"]
    environment:
      APP_ENV: e2e
      APP_DEBUG: "true"
      APP_KEY: "base64:S5Ec61uZh+3hQWkUe50HADhsBp22LuPDyPcRES3QM5k="
      APP_URL: http://localhost:8010
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: point_of_sales_e2e
      DB_USERNAME: root
      DB_PASSWORD: secret
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
      BCRYPT_ROUNDS: 4
      INERTIA_SSR_ENABLED: "false"
      SECURITY_BOT_GUARD_MIN_SUBMIT_SECONDS: 0
      AUTH_FORGOT_PASSWORD_THROTTLE: "1000,1"
      PHP_CLI_SERVER_WORKERS: 4
    command: php artisan serve --host=0.0.0.0 --port=8010 --no-reload
    ports:
      - "8010:8010"

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: point_of_sales
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  mysql-data:
  vendor:
